<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRfy - Free QR Code Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    text-align:center;
    color:white;
}

h1{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin-bottom:15px;
}

.generate{
    background:#2563eb;
    color:white;
}

.download{
    background:#16a34a;
    color:white;
}

#qrcode{
    background:white;
    padding:15px;
    display:inline-block;
    border-radius:10px;
    margin-top:15px;
}
</style>
</head>
<body>

<div class="container">

    <h1>QR Code by NTR Predictss</h1>

    <input
        type="text"
        id="qrText"
        placeholder="Enter text or URL">

    <button class="generate" onclick="generateQR()">
        Generate QR
    </button>

    <div id="qrcode"></div>

    <button class="download" onclick="downloadQR()">
        Download QR
    </button>

</div>

<script>

function generateQR(){

    let text = document.getElementById("qrText").value;

    if(text.trim() === ""){
        alert("Enter text first");
        return;
    }

    document.getElementById("qrcode").innerHTML="";

    new QRCode(document.getElementById("qrcode"),{
        text:text,
        width:250,
        height:250
    });
}

function downloadQR(){

    let img = document.querySelector("#qrcode img");

    if(!img){
        alert("Generate QR first");
        return;
    }

    let link = document.createElement("a");
    link.href = img.src;
    link.download = "qr-code.png";
    link.click();
}

</script>

</body>
</html>
